<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
  <title>Hello World!</title>
</head>
<body>
<h1 th:inline="text">This is simple form based authentication application <span th:remove="tag" sec:authentication="name">thymeleaf</span>!</h1>
<form th:action="@{/logout}" method="post">
  <input type="submit" value="Sign Out"/>
</form>
<p><a th:href="@{/home}">Home</a> | <a th:href="@{/register}">Register User</a> | <a th:href="@{/login}">Login</a></p>
</body>
</html>
